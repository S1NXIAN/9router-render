services:
  - type: web
    name: 9router
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # No persistent disk: Free web services cannot attach disks
    # (Render docs: "Free web services cannot" preserve the filesystem).
    # /app/data works but is ephemeral — spins down after 15 min idle
    # and loses local changes on restart/redeploy. For persistence,
    # switch plan to starter (or higher) and add:
    #   disk:
    #     name: 9router-data
    #     mountPath: /app/data
    #     sizeGB: 1
    envVars:
      # Prompts for a value in the Render Dashboard on first deploy.
      # Used as the dashboard login password when no saved hash exists.
      - key: INITIAL_PASSWORD
        sync: false
      # Auto-generated signing secret for dashboard session cookies.
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
      - key: API_KEY_SECRET
        generateValue: true
      - key: MACHINE_ID_SALT
        generateValue: true
